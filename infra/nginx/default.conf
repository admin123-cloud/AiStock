# 1. 公网域名入口：强制 HTTP Basic Auth 私人鉴权（覆盖前端页面与全部 /api/ 接口）
server {
    listen 80;
    server_name stock.aistock3.fun;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "AiStock Private Access";
    auth_basic_user_file /etc/nginx/htpasswd;

    # 动态解析 Docker 内置 DNS，避免 backend 容器重建后 nginx 缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. 本机回环入口（127.0.0.1:3000）：供本机浏览器与微信桥接免密直连；拦截任何经 Cloudflare 伪造 Host 的请求
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($http_cf_connecting_ip != "") {
        return 403;
    }

    # 动态解析 Docker 内置 DNS，避免 backend 容器重建后 nginx 缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
