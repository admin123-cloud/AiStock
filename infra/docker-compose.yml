# AiStock 唯一容器编排栈（以 F:/Aistock 为根目录，扁平化 runtime/storage 挂载）
# 版本变量 AISTOCK_MAIN_VERSION 由 infra/deploy.sh 注入
# 核心常驻服务（default）：backend / frontend / pipeline-runner / postclose-watcher / clickhouse
# 按需扩展服务（profiles）：research (--profile research) / redis (--profile cache)
name: aistock

networks:
  default:
    name: aistock_default
    external: true

services:
  backend:
    image: aistock-backend:${AISTOCK_MAIN_VERSION:?必须经部署脚本注入}
    pull_policy: never
    container_name: aistock-backend
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 3g
    ports:
      - "127.0.0.1:8077:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/check', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment: &backend_env
      TZ: Asia/Shanghai
      AISTOCK_CLICKHOUSE_HOST: host.docker.internal
      AISTOCK_CLICKHOUSE_PORT: "8123"
      AISTOCK_CLICKHOUSE_DATABASE: stock
      AISTOCK_CLICKHOUSE_USER: default
      AISTOCK_CLICKHOUSE_PASSWORD: ""
      AISTOCK_DATA_ROOT: /aistock/data
      AISTOCK_REPORTS_ROOT: /aistock/reports
      AISTOCK_ARTIFACTS_ROOT: /aistock/artifacts
      AISTOCK_LOGS_ROOT: /aistock/logs
      AISTOCK_TDX_GATEWAY_URL: http://host.docker.internal:8765
    volumes:
      - F:/Aistock/code/config/settings.docker-app.yaml:/app/config/settings.local.yaml:ro
      # 只读观察栈隔离数据根
      - F:/Aistock/runtime/local_observation_preview/data:/aistock/data
      # 只读嵌套挂载真实 runtime 子树 + 受控 scoped-write 白名单通道
      - F:/Aistock/runtime/gen3_state_alpha:/aistock/data/runtime/gen3_state_alpha:ro
      - F:/Aistock/runtime/gen3_state_alpha/holding_t_watchlist:/aistock/data/runtime/gen3_state_alpha/holding_t_watchlist
      - F:/Aistock/runtime/t_tracker:/aistock/data/runtime/t_tracker:ro
      - F:/Aistock/runtime/signal_quality:/aistock/data/runtime/signal_quality:ro
      - F:/Aistock/runtime/daily_review:/aistock/data/runtime/daily_review:ro
      - F:/Aistock/runtime/market_mood:/aistock/data/runtime/market_mood:ro
      - F:/Aistock/runtime/market_turnover_forecast:/aistock/data/runtime/market_turnover_forecast
      - F:/Aistock/runtime/g3_ai_screening:/aistock/data/runtime/g3_ai_screening
      - F:/Aistock/runtime/g3_premarket_brief:/aistock/data/runtime/g3_premarket_brief
      - F:/Aistock/runtime/g3_ai_coach:/aistock/data/runtime/g3_ai_coach
      - F:/Aistock/runtime/g3_prefill_drafts:/aistock/data/runtime/g3_prefill_drafts
      - F:/Aistock/runtime/g3_etf_shadow:/aistock/data/runtime/g3_etf_shadow
      - F:/Aistock/runtime/mining_cache:/aistock/data/runtime/mining_cache
      - F:/Aistock/runtime/mining_runs:/aistock/data/runtime/mining_runs
      - F:/Aistock/runtime/mining_contracts:/aistock/data/runtime/mining_contracts
      - F:/Aistock/runtime/postclose_control:/aistock/data/runtime/postclose_control:ro
      - F:/Aistock/runtime/intraday_snapshot:/aistock/data/runtime/intraday_snapshot:ro
      - F:/Aistock/runtime/postclose_auto:/aistock/data/runtime/postclose_auto:ro
      - F:/Aistock/runtime/ths_read_account:/aistock/data/runtime/ths_read_account:ro
      - F:/Aistock/runtime/ths_read_account/commands:/aistock/data/runtime/ths_read_account/commands
      - backend_logs:/aistock/logs
      - backend_reports:/aistock/reports
      - backend_artifacts:/aistock/artifacts
    command: ["python", "-m", "uvicorn", "api.operations_preview:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: aistock-frontend:latest
    pull_policy: never
    container_name: aistock-frontend
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1g
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - F:/Aistock/code/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  pipeline-runner:
    image: aistock-worker:${AISTOCK_MAIN_VERSION:?必须经部署脚本注入}
    pull_policy: never
    container_name: aistock-pipeline-runner
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 3g
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    environment:
      <<: *backend_env
      PYTHONPATH: /app
      AISTOCK_CLICKHOUSE_HOST: 127.0.0.1
      TDX_BASE: /d/TDX
      AISTOCK_TDX_VIPDOC_ROOT: /d/TDX/vipdoc
    volumes:
      - F:/Aistock/code/config/settings.docker-app.yaml:/app/config/settings.local.yaml:ro
      # 扁平化运行时与温存储挂载（容器内继续映射为 /aistock/data/* 保持 100% 兼容）
      - F:/Aistock/runtime:/aistock/data/runtime
      - F:/Aistock/storage/warehouse:/aistock/data/warehouse
      - F:/Aistock/storage/cache:/aistock/data/cache
      - F:/Aistock/storage/tmp:/aistock/data/tmp
      - F:/Aistock/storage/reports:/aistock/reports
      - F:/Aistock/storage/artifacts:/aistock/artifacts
      - F:/Aistock/storage/logs:/aistock/logs
      # 通达信本地盘后下载产物只读挂载
      - D:/TDX:/d/TDX:ro
    command: ["python", "-m", "pipelines.scheduler"]

  postclose-watcher:
    image: aistock-worker:${AISTOCK_MAIN_VERSION:?必须经部署脚本注入}
    pull_policy: never
    container_name: aistock-postclose-watcher
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256m
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /app
    volumes:
      - F:/Aistock/code/config/settings.docker-app.yaml:/app/config/settings.local.yaml:ro
      - F:/Aistock/runtime/postclose_control:/aistock/data/runtime/postclose_control:ro
      - F:/Aistock/runtime/postclose_alerts:/aistock/data/runtime/postclose_alerts
    command:
      [
        "python",
        "pipelines/postclose_watcher.py",
        "--control-root",
        "/aistock/data/runtime/postclose_control",
        "--outbox-dir",
        "/aistock/data/runtime/postclose_alerts",
        "--config-path",
        "/app/config/settings.local.yaml",
        "--send-email",
        "--allow-uninitialized-state",
        "--loop-seconds",
        "120",
      ]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aistock-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - aistock_clickhouse_data:/var/lib/clickhouse:rw
      - F:/Aistock/code/config/clickhouse/config.d/aistock-throttle.xml:/etc/clickhouse-server/config.d/aistock-throttle.xml:ro
      - F:/Aistock/code/config/clickhouse/users.d/aistock-throttle.xml:/etc/clickhouse-server/users.d/aistock-throttle.xml:ro
      - F:/Aistock/code/config/clickhouse/users.d/zz-docker-networks.xml:/etc/clickhouse-server/users.d/zz-docker-networks.xml:ro
      - aistock_clickhouse_log:/var/log/clickhouse-server:rw
    networks:
      default:
        aliases:
          - clickhouse

  # ───────────────────── 未来按需扩展容器（Profiles）─────────────────────

  research:
    image: aistock-research:latest
    build:
      context: F:/Aistock/code
      dockerfile: infra/docker/Dockerfile.research
    container_name: aistock-research
    profiles: ["research"]
    restart: "no"
    cpus: "2.0"
    mem_limit: 4g
    environment:
      <<: *backend_env
      PYTHONPATH: /app
    volumes:
      - F:/Aistock/code:/app:ro
      - F:/Aistock/code/research:/app/research:rw
      - F:/Aistock/runtime:/aistock/data/runtime:ro
      - F:/Aistock/storage/warehouse:/aistock/data/warehouse:ro
      - F:/Aistock/storage/reports:/aistock/reports:rw

  redis:
    image: redis:7-alpine
    container_name: aistock-redis
    profiles: ["cache"]
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    command: ["redis-server", "--appendonly", "no"]

volumes:
  backend_logs:
  backend_reports:
  backend_artifacts:
  aistock_clickhouse_data:
    external: true
  aistock_clickhouse_log:
    external: true
