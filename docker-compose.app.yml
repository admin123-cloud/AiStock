name: aistock-core

services:
  backend:
    image: aistock-core-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aistock-backend-dev
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 9g
    memswap_limit: 9g
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/check', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      TZ: Asia/Shanghai
      AISTOCK_CLICKHOUSE_HOST: host.docker.internal
      AISTOCK_CLICKHOUSE_PORT: "8123"
      AISTOCK_CLICKHOUSE_DATABASE: stock
      AISTOCK_CLICKHOUSE_USER: default
      AISTOCK_CLICKHOUSE_PASSWORD: ""
      AISTOCK_DATA_ROOT: /aistock/data
      AISTOCK_REPORTS_ROOT: /aistock/reports
      AISTOCK_ARTIFACTS_ROOT: /aistock/artifacts
      AISTOCK_LOGS_ROOT: /aistock/logs
      AISTOCK_HOST_REPO_ROOT: "F:\\Stock\\AiStock-core"
      AISTOCK_LOCAL_TDX_ROOT: /tdx/vipdoc
      AISTOCK_STRICT_TDXQ_STARTUP: "0"
      AISTOCK_STARTUP_SCHEDULERS_ENABLED: "1"
      AISTOCK_CORE_DATA_MAINTENANCE_SCHEDULER_ENABLED: "0"
      AISTOCK_STARTUP_TDXQUANT_CHECK_ENABLED: "0"
      AISTOCK_TDX_GATEWAY_URL: http://host.docker.internal:8765
      AISTOCK_QMT_TICK_BRIDGE_URL: http://host.docker.internal:8766/full-tick
      AISTOCK_QMT_ACCOUNT_BRIDGE_URL: http://host.docker.internal:8766/account-snapshot
    volumes:
      - .:/app
      - ./config/settings.docker-app.yaml:/app/config/settings.local.yaml:ro
      - F:/Stock/AiStockData/data:/aistock/data
      - F:/Stock/AiStockData/artifacts:/aistock/artifacts
      - F:/Stock/AiStockData/logs:/aistock/logs
      - F:/Stock/AiStockResearchArchive/reports:/aistock/reports
      - D:/TDX/vipdoc:/tdx/vipdoc:ro
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: aistock-core-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aistock-frontend-dev
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      TZ: Asia/Shanghai
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
