  aliyun:
    access_key_id: ""
    access_key_secret: ""
  tencent:
    secret_id: ""
    secret_key: ""

# 邮件服务配置
email:
  smtp_server: ""
  smtp_port: 587
  username: ""
  password: ""  # 邮箱授权码，不是登录密码

# 微信/钉钉通知配置
notification:
  wechat:
    corpid: ""
    agentid: ""
    secret: ""
  dingtalk:
    access_token: ""
    secret: ""

# 其他第三方服务密钥
services:
  # 百度统计
  baidu_tongji:
    api_key: ""
  # 友盟统计
  umeng:
    app_key: ""
    app_secret: ""
