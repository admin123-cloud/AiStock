name: aistock-core

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aistock-clickhouse
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_DB: stock
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./config/clickhouse/config.d/aistock-throttle.xml:/etc/clickhouse-server/config.d/aistock-throttle.xml:ro
      - ./config/clickhouse/users.d/aistock-throttle.xml:/etc/clickhouse-server/users.d/aistock-throttle.xml:ro
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server

  backend:
    image: aistock-core-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aistock-backend-dev
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 3g
    memswap_limit: 3g
    depends_on:
      - clickhouse
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      AISTOCK_CLICKHOUSE_HOST: clickhouse
      AISTOCK_CLICKHOUSE_PORT: "8123"
      AISTOCK_CLICKHOUSE_DATABASE: stock
      AISTOCK_CLICKHOUSE_USER: default
      AISTOCK_CLICKHOUSE_PASSWORD: ""
      AISTOCK_DATA_ROOT: /aistock/data
      AISTOCK_REPORTS_ROOT: /aistock/reports
      AISTOCK_ARTIFACTS_ROOT: /aistock/artifacts
      AISTOCK_LOGS_ROOT: /aistock/logs
      AISTOCK_LOCAL_TDX_ROOT: /tdx/vipdoc
      AISTOCK_STRICT_TDXQ_STARTUP: "0"
      AISTOCK_TDX_GATEWAY_URL: http://host.docker.internal:8765
    volumes:
      - .:/app
      - ./config/settings.docker-dev.yaml:/app/config/settings.local.yaml:ro
      - F:/Stock/AiStockData/data:/aistock/data
      - F:/Stock/AiStockData/artifacts:/aistock/artifacts
      - F:/Stock/AiStockData/logs:/aistock/logs
      - F:/Stock/AiStockResearchArchive/reports:/aistock/reports
      - D:/TDX/vipdoc:/tdx/vipdoc:ro
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: aistock-core-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aistock-frontend-dev
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Shanghai
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  clickhouse_data:
  clickhouse_log:
  frontend_node_modules:
