name: aistock-core

# ClickHouse is managed by its own lifecycle. Reuse its existing network so
# release backend/frontend can switch without recreating the database container.
networks:
  default:
    name: aistock-core_default
    external: true

services:
  backend:
    image: aistock-core-backend:${AISTOCK_RELEASE_VERSION:?set exact release commit}
    container_name: aistock-backend-dev
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 9g
    ports: ["127.0.0.1:8000:8000"]
    environment:
      TZ: Asia/Shanghai
      AISTOCK_RELEASE_VERSION: ${AISTOCK_RELEASE_VERSION}
      AISTOCK_REVIEW_OPERATOR: ${AISTOCK_REVIEW_OPERATOR:?set review operator}
      # ClickHouse is attached to this Compose project's network under the
      # stable service alias.  Its host port is deliberately loopback-only,
      # so host.docker.internal cannot reach it from the backend container.
      AISTOCK_CLICKHOUSE_HOST: clickhouse
      AISTOCK_DATA_ROOT: /aistock/data
      AISTOCK_REPORTS_ROOT: /aistock/reports
      AISTOCK_ARTIFACTS_ROOT: /aistock/artifacts
      AISTOCK_LOGS_ROOT: /aistock/logs
      AISTOCK_HOST_REPO_ROOT: ${AISTOCK_HOST_REPO_ROOT:?set verified host checkout}
      AISTOCK_STARTUP_SCHEDULERS_ENABLED: "1"
      AISTOCK_CORE_DATA_MAINTENANCE_SCHEDULER_ENABLED: "0"
      AISTOCK_SECTOR_DAILY_OWNER: "host"
      AISTOCK_REFERENCE_DATA_OWNER: "host"
      AISTOCK_QMT_TICK_BRIDGE_URL: http://host.docker.internal:8766/full-tick
      AISTOCK_QMT_ACCOUNT_BRIDGE_URL: http://host.docker.internal:8766/account-snapshot
      AISTOCK_TDX_GATEWAY_URL: http://host.docker.internal:8765
      AISTOCK_LOCAL_TDX_ROOT: /tdx/vipdoc
    volumes:
      - type: bind
        source: ${AISTOCK_SETTINGS_FILE:?set private configuration file}
        target: /app/config/settings.local.yaml
        read_only: true
        bind: {create_host_path: false}
      - F:/AiStock/data/data:/aistock/data
      - F:/AiStock/data/artifacts:/aistock/artifacts
      - F:/AiStock/data/logs:/aistock/logs
      - F:/AiStock/research/reports:/aistock/reports
      - D:/TDX/vipdoc:/tdx/vipdoc:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 60s
    stop_grace_period: 120s
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.release
    image: aistock-core-frontend:${AISTOCK_RELEASE_VERSION:?set exact release commit}
    container_name: aistock-frontend-react-dev
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
