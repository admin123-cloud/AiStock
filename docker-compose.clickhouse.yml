services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aistock-clickhouse
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 4g
    memswap_limit: 4g
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: stock
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./config/clickhouse/config.d/aistock-throttle.xml:/etc/clickhouse-server/config.d/aistock-throttle.xml:ro
      - ./config/clickhouse/users.d/aistock-throttle.xml:/etc/clickhouse-server/users.d/aistock-throttle.xml:ro
      - ./config/clickhouse/config.d/aistock-backups.xml:/etc/clickhouse-server/config.d/aistock-backups.xml:ro
      - F:/Stock/clickhouse_backup/native:/backups
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server

volumes:
  clickhouse_data:
    external: true
    name: aistock_clickhouse_data
  clickhouse_log:
    external: true
    name: aistock_clickhouse_log
